<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vetrina Foto 3D</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f7f6;
    color: #333;
    line-height: 1.6;
}

header {
    background: #2c3e50;
    color: white;
    padding: 1em;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 2em;
}

nav a {
    color: #ecf0f1;
    margin: 0 1em;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    color: #3498db;
}

main {
    max-width: 1200px;
    margin: 2em auto;
    padding: 1em;
    text-align: center;
}

section h2 {
    font-size: 1.6em;
    color: #2c3e50;
    margin: 0.5em 0;
}

/* Layout a griglia responsiva */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    justify-items: center;
}

/* Contenitore singola foto */
.foto {
    text-align: center;
}

/* Immagini responsive */
.foto img {
    width: 100%;
    height: auto;
    max-width: 300px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    display: block;
    margin: 0 auto 10px auto;
    object-fit: contain;
    cursor: pointer; /* Aggiunta la manina per far capire che è cliccabile */
    transition: transform 0.2s ease; /* Un piccolo effetto visivo al passaggio del mouse */
}

.foto img:hover {
    transform: scale(1.03);
}

/* Descrizione sotto l’immagine */
.foto p {
    font-size: 0.9em;
    margin: 0;
    color: #555;
}
</style>
</head>
<body>

<header>
    <h1>Galleria Fotografica</h1>
    <nav>
        <a href="index.html">3D</a> |
        <a href="foto.html">Foto</a> |
        <a href="contatti.html">Contatti</a>
    </nav>
</header>

<main>
    <p>Esplora le mie foto con descrizione sintetica. Clicca per aprire in dimensione originale.</p>

    <section id="galleria-foto" class="grid">
        </section>
</main>

<script>
// --- Array delle foto ottimizzato ---
// NOTA: 'thumb' punta all'anteprima compressa (.webp), 'src' punta al file originale pesante
const fotoDemo = [
    {
        thumb: "images/anteprime/ARVI.webp",
        src: "images/ARVI.jpg",
        descrizione: "In Verde le aree aride (ARVI-RGB,no IR)"
    },
    {
        thumb: "images/anteprime/DSM.webp",
        src: "images/DSM.jpg",
        descrizione: "DSM ad alta risoluzione per computi GIS"
    },
    {
        thumb: "images/anteprime/portis_orto.webp",
        src: "images/portis_orto.png",
        descrizione: "Esempio di Ortofoto di un paese ridotto in dimensioni ed esportato in PNG"
    },
    {
        thumb: "images/anteprime/geotiff.webp",
        src: "images/geotiff.png",
        descrizione: "Elaborazione WebODM foto aeree georeferenziate"
    },
    {
        thumb: "images/anteprime/Analisi_allineamento.webp",
        src: "images/Analisi allineamento.png",
        descrizione: "Report rilievo foto aeree georeferenziate senza uso di GCP"
    },
    {
        thumb: "images/anteprime/Rilevamento_vetture.webp",
        src: "images/Rilevamento vetture.png",
        descrizione: "Strumento di WebODM per rilevamento vetture per eventuali stime parcheggi"
    },
    {
        thumb: "images/anteprime/GeoJSON.webp",
        src: "images/GeoJSON.png",
        descrizione: "esempio di esportazioni informazioni GeoJSON"
    },
    {
        thumb: "images/anteprime/moimacco_pdf.webp",
        src: "images/moimacco.pdf.png",
        descrizione: "Da nuvola ad Autocad"
    },
    {
        thumb: "images/anteprime/sezione.webp",
        src: "images/sezione.png",
        descrizione: "Esempio di sezione per profilo del target"
    },
    {
        thumb: "images/anteprime/Confronto.webp",
        src: "images/Confronto.png",
        descrizione: "A sinistra Ortofoto importata in autocad - a destra diapositiva mesh 3d"
    },
    {
        thumb: "images/anteprime/torreOrto.webp",
        src: "images/torreOrto.png",
        descrizione: "Ortofoto ponte e area limitrofa"
    },
    {
        thumb: "images/anteprime/volumi.webp",
        src: "images/volumi.png",
        descrizione: "Analisi volume di edificio 3D"
    }
];

const galleria = document.getElementById("galleria-foto");

fotoDemo.forEach(foto => {
    const div = document.createElement("div");
    div.className = "foto";

    const img = document.createElement("img");
    img.src = foto.thumb; // ⚡ Mostra l'anteprima leggera nella griglia
    img.alt = foto.descrizione;
    
    // ⚡ Carica l'immagine solo quando appare sullo schermo (ottimo per le performance)
    img.loading = "lazy"; 
    
    img.onclick = () => {
        window.open(foto.src, "_blank"); // ⚡ Apre il file originale pesante in un'altra scheda solo al clic
    };

    const p = document.createElement("p");
    p.textContent = foto.descrizione;

    div.appendChild(img);
    div.appendChild(p);
    galleria.appendChild(div);
});
</script>

</body>
</html>
